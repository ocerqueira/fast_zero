[project]
name = "fast-zero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "fastapi[standard]>=0.129.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
    "taskipy>=1.14.1",
]


[tool.ruff]
line-length = 79
exclude = ["migrations"]

[tool.ruff.lint]
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-p no:warnings"

[tool.taskipy.tasks]
lint = "ruff check ."
pre_format = "ruff check --fix ."
format = "ruff format ."
run = "fastapi dev fast_zero/app.py --reload"
pre_test = "task lint"
test = "pytest -vv --cov=fast_zero"
post_test = "pytest --cov-report=html"
